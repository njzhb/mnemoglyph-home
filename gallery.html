<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>照片庫 | Beam & Muse</title>
  <link rel="canonical" href="./gallery/">
  <link rel="stylesheet" href="assets/site-nav.css">
  <style>
    body { background: #161c2b; color: #fff; font-family: 'Noto Serif TC', serif; }
    .gallery { display: flex; flex-wrap: wrap; gap: 22px; padding: 48px; }
    .thumb { width: 180px; height: 120px; object-fit: cover; border-radius: 12px; box-shadow: 0 2px 8px #0003; cursor: pointer; transition: .2s; }
    .thumb:hover { box-shadow: 0 4px 18px #22e3; transform: scale(1.03);}
    .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.77); align-items: center; justify-content: center;}
    .modal img { max-width: 80vw; max-height: 80vh; border-radius: 16px;}
    .modal .close { position: absolute; top: 22px; right: 36px; font-size: 2.2em; color: #eee; cursor: pointer;}
    .legacy-note { margin: 72px auto 0; max-width: 720px; padding: 12px 18px; border: 1px solid #ffffff22; border-radius: 12px; color: #ddd; background: #ffffff0a; line-height: 1.7; }
    .legacy-note a { color: #ffe7a8; }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="站点导航">
    <a href="./">归处</a>
    <a href="./archive/">Archive</a>
    <a href="./gallery/">正式照片库</a>
  </nav>
  <p class="legacy-note"><strong>Legacy / Archive：</strong>这是照片库的早期双图版本，保留用于历史核对；正式入口为 <a href="./gallery/">/gallery/</a>。本页内容公开，不提供客户端密码保护。</p>
  <h2 style="text-align:center;letter-spacing:0.16em;">照片庫 Gallery</h2>
  <div class="gallery">
  <img src="gallery/muse.png" class="thumb" alt="照片1" data-full="gallery/muse.png">

  <img src="gallery/muse01.png" class="thumb" alt="照片2" data-full="gallery/muse01.png">
  <!-- 更多图片 -->
</div>
    <!-- ...可继续添加更多图片 -->

  <!-- 大图弹窗 -->
  <div class="modal" id="imgModal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="bigImg" src="">
  </div>

  <script>
    document.querySelectorAll('.thumb').forEach(img => {
      img.onclick = function() {
        document.getElementById('bigImg').src = this.dataset.full;
        document.getElementById('imgModal').style.display = 'flex';
      }
    });
    function closeModal() {
      document.getElementById('imgModal').style.display = 'none';
      document.getElementById('bigImg').src = "";
    }
  </script>
</body>
</html>
